## ==========================================
## DATASOURCE - PostgreSQL
## ==========================================
spring.datasource.platform=postgres
spring.database.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/pird
spring.datasource.username=pird
spring.datasource.password=pird

## ==========================================
## JPA / HIBERNATE
## ==========================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=none

## ==========================================
## POSTGIS / HIBERNATE SPATIAL
## In Hibernate 6.x (Spring Boot 3.x), spatial support is built into
## PostgreSQLDialect when hibernate-spatial is on the classpath.
## The old PostgisPG10Dialect was removed in Hibernate 6.
## ==========================================

## ==========================================
## SWAGGER / SPRINGDOC
## ==========================================
spring.mvc.pathmatch.matching-strategy=ant-path-matcher
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

## ==========================================
## JWT SECURITY
## ==========================================
# IMPORTANTE: Em produção, substitua por uma chave forte (min. 32 chars)
# e armazene como variável de ambiente: API_SECURITY_TOKEN_SECRET
api.security.token.secret=${API_SECURITY_TOKEN_SECRET:chave-secreta-pird-2024-troque-em-producao!}

## ==========================================
## MAPBOX
## ==========================================
mapbox.token=${MAPBOX_TOKEN:}